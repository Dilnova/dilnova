name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Audit Dependencies
        run: pnpm audit --audit-level=low

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Check Formatting
        run: pnpm run format:check

      - name: Check Linting
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Validate TypeScript
        run: pnpm exec tsc --noEmit

  db-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Verify Database Migrations
        run: pnpm run db:verify

      - name: Test Migrations Execution
        run: pnpm run db:migrate
        env:
          MIGRATION_DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/postgres"
          DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/postgres"

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Unit Tests with Coverage
        run: pnpm run test:coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Database Migrations
        run: pnpm run db:migrate
        env:
          DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/postgres"

      - name: Run Production Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/postgres"
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "placeholder"
          CLOUDINARY_API_KEY: "placeholder"
          CLOUDINARY_API_SECRET: "placeholder"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
          UPSTASH_REDIS_REST_URL: "https://placeholder.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "placeholder"
          PII_ENCRYPTION_KEY: "placeholder_key_at_least_32_characters_long"
          HEALTH_CHECK_SECRET: "placeholder"
          SMTP_USER: "placeholder"
          SMTP_PASSWORD: "placeholder"
          SENTRY_DSN: "placeholder"
          NEXT_PUBLIC_SENTRY_DSN: "placeholder"
          EMAIL_FROM_ADDRESS: "info@example.com"
          EMAIL_FROM_NAME: "Placeholder"
          SUPERADMIN_USER_IDS: "user_placeholder"
          CLERK_WEBHOOK_SECRET: "whsec_placeholder"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
          TURNSTILE_SECRET_KEY: "1x00000000000000000000AA"
          QSTASH_TOKEN: "dummy_qstash_token"
          CRON_SECRET: "placeholder_cron_secret"
          ANALYZE: "true"

      - name: Analyze Bundle Size
        run: pnpm run analyze:bundle

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test-e2e:
    needs: [build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next/

      - name: Run Database Migrations
        run: pnpm run db:migrate
        env:
          DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/postgres"

      - name: Install Playwright Browsers
        run: pnpm run test:e2e:install

      - name: Run E2E Tests
        run: pnpm run test:e2e
        env:
          DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/postgres"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install and Run Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact

  deploy-production:
    name: Deploy to Vercel (Production)
    needs: [test-e2e, audit, lint, typecheck, db-verify, test-unit, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Check Vercel Deployment Secrets
        id: check-secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::warning ::Vercel deployment secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) are not configured. Deployment step skipped."
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts for Production
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Prebuilt Artifacts to Vercel Production
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
