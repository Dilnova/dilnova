name: "Vercel Preview Deployment E2E Smoke Tests"

on:
  deployment_status:

permissions:
  contents: read
  statuses: write

jobs:
  preview-e2e:
    name: Run E2E Smoke Tests on Vercel Preview
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Install Playwright Browsers
        run: pnpm run test:e2e:install

      - name: Run E2E Smoke Tests against Vercel Preview URL
        run: pnpm run test:e2e --project=public --project=unauthenticated
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vercel-preview-playwright-report
          path: playwright-report/
          retention-days: 7
